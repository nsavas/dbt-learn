sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      loaded_at_field: _etl_loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
              
        config:
          freshness:
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
      - name: customers        # inherits the source-level default
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
              
        config:
          freshness: null      # opt this table out entirely